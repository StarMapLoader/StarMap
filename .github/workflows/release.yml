name: Release from version tag

on:
    push:
        tags:
            - '[0-9]*.[0-9]*.[0-9]*'

permissions:
    contents: write

env:
    DOTNET_VERSION: 10.0
    PROJECT: StarMap/StarMap.csproj
    API_PROJECT: StarMap.API/StarMap.API.csproj
    OUTPUT_PATH: ./publish
    NUGET_SOURCE: "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
    EXCLUDE: "*.pdb *.xml"

jobs:
    build:
        runs-on: ubuntu-latest
        outputs:
            new_version: ${{ steps.version.outputs.new_version }}
            prev_version: ${{ steps.version.outputs.prev_version }}
            release_tag: ${{ steps.version.outputs.release_tag }}
            api_changed: ${{ steps.api_check.outputs.api_changed }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  fetch-tags: true

            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Read version from release tag
              id: version
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "::error::Release tags must use semantic version format X.Y.Z (for example, 1.2.3)."
                    exit 1
                  fi

                  previous_tag=""
                  if git rev-parse --verify "${GITHUB_SHA}^" >/dev/null 2>&1; then
                    previous_tag=$(git tag --merged "${GITHUB_SHA}^" --format='%(refname:short)' \
                      | awk '/^[0-9]+\.[0-9]+\.[0-9]+$/ { print }' \
                      | sort -V \
                      | tail -n 1)
                  fi

                  echo "Release version: $RELEASE_TAG"
                  echo "Previous release tag: ${previous_tag:-none}"
                  {
                    echo "release_tag=$RELEASE_TAG"
                    echo "new_version=$RELEASE_TAG"
                    echo "prev_version=$previous_tag"
                  } >> "$GITHUB_OUTPUT"

            - name: Setup NuGet source
              run: |
                  dotnet nuget add source \
                    --username ${{ secrets.ORG_PACKAGE_USERNAME }} \
                    --password ${{ secrets.ORG_PACKAGE_TOKEN }} \
                    --store-password-in-clear-text \
                    --name StarMapGitHubNugetSource "${{ env.NUGET_SOURCE }}"

            - name: Build standalone
              run: |
                  dotnet publish ${{ env.PROJECT }} \
                    -c Release \
                    -o ${{ env.OUTPUT_PATH }} \
                    -r win-x64 \
                    --self-contained false \
                    /p:PackageVersion=${{ steps.version.outputs.new_version }} \
                    /p:Version=${{ steps.version.outputs.new_version }} \
                    /p:AssemblyVersion=${{ steps.version.outputs.new_version }} \
                    /p:FileVersion=${{ steps.version.outputs.new_version }}

            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: publish
                  path: |
                      ${{ env.OUTPUT_PATH }}
                      version.txt
                  retention-days: 1

            - name: Check whether StarMap.API changed since previous tag
              id: api_check
              run: |
                  current_commit="${GITHUB_SHA}"
                  prev="${{  steps.version.outputs.prev_version }}"

                  echo "previous_tag=$prev" >> $GITHUB_OUTPUT

                  if [ -z "$prev" ]; then
                      echo "api_changed=true" >> $GITHUB_OUTPUT
                      exit 0
                  fi

                  echo "Previous tag: $prev"
                  echo "Current commit: $current_commit"

                  diff=$(git diff --name-only "$prev" "$current_commit")

                  {
                      echo "diff_files<<EOF"
                      echo "$diff"
                      echo "EOF"
                  } >> "$GITHUB_OUTPUT"

                  if echo "$diff" | grep -qE '^StarMap.API/|^StarMap.API.csproj'; then
                      echo "api_changed=true" >> $GITHUB_OUTPUT
                  else
                      echo "api_changed=false" >> $GITHUB_OUTPUT
                  fi

    publish-nuget:
        runs-on: ubuntu-latest
        needs: build
        if: needs.build.outputs.api_changed == true
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Download build artifacts
              uses: actions/download-artifact@v4
              with:
                  name: publish
                  path: ./build_artifacts

            - name: Setup NuGet source
              run: |
                  dotnet nuget add source \
                    --username ${{ secrets.ORG_PACKAGE_USERNAME }} \
                    --password ${{ secrets.ORG_PACKAGE_TOKEN }} \
                    --store-password-in-clear-text \
                    --name StarMapGitHubNugetSource "${{ env.NUGET_SOURCE }}"

            - name: Pack and push StarMap.API (if changed)
              run: |
                  dotnet restore StarMap.API/StarMap.API.csproj
                  dotnet pack StarMap.API/StarMap.API.csproj \
                    -c Release \
                    -o ./nupkg \
                    /p:PackageVersion=${{ needs.build.outputs.new_version }} \
                    /p:Version=${{ needs.build.outputs.new_version }} \
                    /p:AssemblyVersion=${{ needs.build.outputs.new_version }} \
                    /p:FileVersion=${{ needs.build.outputs.new_version }}
                  dotnet nuget push ./nupkg/*.nupkg \
                    --source https://api.nuget.org/v3/index.json \
                    --api-key "${{ secrets.NUGET_API_KEY }}" \
                    --skip-duplicate

    release-zip:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Download build artifacts
              uses: actions/download-artifact@v4
              with:
                  name: publish
                  path: ./build_artifacts

            - name: Ensure zip is available
              run: |
                  sudo apt-get update -y
                  sudo apt-get install -y zip

            - name: Package ZIP
              run: |
                  cd ./build_artifacts/${{ env.OUTPUT_PATH }}
                  zip -r $GITHUB_WORKSPACE/StarMap-${{ needs.build.outputs.new_version }}.zip . -x ${{ env.EXCLUDE }}
                  cd -

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ needs.build.outputs.release_tag }}
                  name: Release ${{ needs.build.outputs.new_version }}
                  body: |
                      Automated release for version ${{ needs.build.outputs.new_version }}
                      Created from tag ${{ needs.build.outputs.release_tag }} at commit ${{ github.sha }}
                  files: |
                      StarMap-${{ needs.build.outputs.new_version }}.zip

    publish-docs:
        needs: [build, release-zip]
        permissions:
            contents: read
            pages: write
            id-token: write
        uses: ./.github/workflows/publish-docs.yml
        with:
            rc_ref: main

    build-release-installer:
        runs-on: windows-latest
        needs: [build, release-zip]
        steps:
            - uses: actions/checkout@v4

            # Download the published files from Linux job
            - name: Download publish folder
              uses: actions/download-artifact@v4
              with:
                  name: publish
                  path: .

            # Install Inno Setup via Chocolatey
            - name: Install Inno Setup
              run: choco install innosetup --yes

            # Build the installer using the same version as ZIP
            - name: Build Inno Setup Installer
              run: |
                  ISCC.exe installer\WindowsInstaller.iss /dAppVersion=${{ needs.build.outputs.new_version }} /dOutputName=StarMap-${{ needs.build.outputs.new_version }}

            # Attach installer to the release
            - name: Attach installer to GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ needs.build.outputs.release_tag }}
                  files: installer/dist/StarMap-${{ needs.build.outputs.new_version }}.exe
