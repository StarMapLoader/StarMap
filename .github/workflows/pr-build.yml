name: PR build check

on:
    pull_request:
        types: [opened, synchronize, labeled, reopened, edited]
        branches: [main]

permissions:
    contents: read
    packages: read

env:
    DOTNET_VERSION: 10.0
    PROJECT: StarMap/StarMap.csproj
    NUGET_SOURCE: "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

jobs:
    build-preview:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Configure GitHub Packages
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  dotnet nuget add source \
                    --username "$GITHUB_ACTOR" \
                    --password "$GITHUB_TOKEN" \
                    --store-password-in-clear-text \
                    --name StarMapGitHubNugetSource "$NUGET_SOURCE"

            - name: Build Release
              run: dotnet build "$PROJECT" --configuration Release

            - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: "3.12"

            - name: Install documentation dependencies
              run: python -m pip install --requirement requirements-docs.txt

            - name: Build documentation
              run: zensical build --clean --strict
